      <div class="col flex justify-content-center align-items-center bg-white border-round-xl">
        <div class="auth-form" class="w-9">
          <div class="mb-4 mt-4">
            <h2 class="font-medium text-center">Connectez-vous à votre compte</h2>
          </div>
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-4 w-full">
            <div class="w-full">
              <select  class="w-full selectlogin">
                <option>UM Amezmiz</option>
                <option>--</option>
            </select>
            </div>
            <div class="w-full">
              <select  class="w-full selectlogin ">
                <option>Box 1</option>
                <option>Box 2</option>
            </select>
            </div>
          <div class="w-full">
            <span class="p-input-icon-left w-full">
                <i class="pi pi-envelope"></i>
                <input type="text" pInputText formControlName="login" class="p-inputtext-lg w-full" placeholder="Entrez votre identifiant">         
            </span>
            <div *ngIf="loginForm.get('login')?.invalid && (loginForm.get('login')?.dirty || loginForm.get('login')?.touched)">
              <div class="input-errors" *ngIf="loginForm.get('login')?.errors?.['required']">Identifiant obligatoire</div>
            </div>
          </div>
          <div class="w-full">
            <span class="p-input-icon-left w-full">
                <i class="pi pi-key"></i>
                <input type="password" pInputText formControlName="password" class="p-inputtext-lg w-full" placeholder="Tapez votre mot de passe">         
            </span>
            <div *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)">
              <div class="input-errors" *ngIf="loginForm.get('password')?.errors?.['required']">Mot de passe est obligatoire</div>
            </div>
          </div>
          <div class="w-full mt-4 mb-5 ">
            <button *ngIf="!isLoading" pButton pRipple label="Se connecter" class="w-full text-lg login-btn" [disabled]="loginForm.invalid"></button>
            <button *ngIf="isLoading" pButton pRipple label="Connexion en cours..." class="w-full text-lg login-btn" [disabled]="loginForm.invalid"></button>
          </div>
        </form>
        </div>
      </div>
    </div>
  </div>

</div>
