<div class="grid">
    <div class="col-12 sm:col-12 md:col-12 lg:col-3">
        <div class="card-filter p-2">
            <div class="flex justify-content-between align-items-center filter cursor-pointer" *ngFor="let filter of [0,1,2,3,4,5,6,7]">
                <div>
                    <p>Généraliste</p>
                </div>
                <div>
                    <p>12 / 09 / 2024</p>
                </div>
            </div>
            <div class="flex justify-content-between align-items-center filter active cursor-pointer">
                <div>
                    <p>Généraliste</p>
                </div>
                <div>
                    <p>12 / 09 / 2025</p>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12 sm:col-12 md:col-12 lg:col-9">
        <div class="table-container p-2">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th class="p-3 espace-th">Les constants</th>
                            <th class="p-3 " *ngFor="let header of headers">{{ header | date:'dd/MM/yyyy hh:mm:ss' }}</th>
                          </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let row of data; let rowIndex = index">
                            <td class="text-left text-lg p-3 vertical-header">{{ verticalHeaders[rowIndex] }}</td>
                            <td class="text-left text-lg p-3" *ngFor="let cell of row">{{ cell }}</td>
                          </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
