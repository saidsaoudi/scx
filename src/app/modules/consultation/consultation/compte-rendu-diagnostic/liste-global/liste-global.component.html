<div class="grid">
    <div class="col-12 sm:col-12 md:col-8 lg:col-8">
        <p-autoComplete   field="name" [minLength]="1" class="w-full" placeholder="Exemple : 04 Maladies "></p-autoComplete>
        <div class="col-12  mt-3">
            <h4 class="flex align-items-center"><i class="pi pi-angle-left text-3xl icon-tele"></i> <span class="pl-2">Tumeurs</span></h4>
        </div>
        <div class="grid mt-3">
            <div class="col-12 sm:col-12 md:col-6 lg:col-6">
                <div class="card active mb-3">
                    <p>2A00.0 Gliomes du cerveau</p>
                </div>
                <div class="card mb-3" *ngFor="let n of [0,1,2]">
                    <p>Lorem ipsum dolor sit amet, consectetur adip...</p>
                </div>
            </div>
            <div class="col-12 sm:col-12 md:col-6 lg:col-6">
                <div class="card mb-3" *ngFor="let n of [0,1,3]">
                    <p>Lorem ipsum dolor sit amet, consectetur adip...</p>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12 sm:col-12 md:col-4 lg:col-4">
        <p-autoComplete   field="name" [minLength]="1" class="w-full" placeholder="Exemple : 04 Maladies "></p-autoComplete>
        <div class="col-12">
            <div class="card active mt-3 mb-3">
                <p>Diagnostic 1</p>
            </div>
            <div class="card mb-3" *ngFor="let n of [0,1,2]">
                <p>Diagnostic 2</p>
            </div>
        </div>
    </div>
</div>
<div class="flex justify-content-between md:mt-6">
    <button   pRipple type="button" pButton label="Annuler"  class="text-white surface-500 surface-border px-3 py-2 text-base border-1 border-solid border-round cursor-pointer transition-all transition-duration-200 hover:surface-500 hover:surface-border active:surface-500 active:surface-border md:w-2"></button>
    <button  pRipple pButton type="button" label="Ajouter"  class="text-white bg-primary-500 border-primary-500 px-3 py-2 text-base border-1 border-solid border-round cursor-pointer md:w-2"></button>
</div>
