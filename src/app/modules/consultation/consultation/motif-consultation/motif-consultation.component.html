<div  class="w-9 mb-8 ml-auto mr-auto mt-8 chip-motif">
    <form [formGroup]="motifForm"
        (ngSubmit)="addMotif()"
        autocomplete="off"
        novalidate>
        <label class="mb-3 block">Motif de consultation</label>
        <div class="grid">
            <div class="col-12 sm:col-12 md:col-10 lg:col-10">
                <p-chips formControlName="motifComplaint" separator=","></p-chips>
            </div>
            <div class="col-12 sm:col-12 md:col-2 lg:col-2">
                <p-button icon="pi pi-plus-circle" label="Ajouter"></p-button>
            </div>
        </div>        
    </form>
</div>
<div class="col-12 mt-6 text-right">
    <button pRipple pButton class="btn-terminer px-4 py-2 border-round-sm" (click)="addMotif()">
        Étape suivante
    </button>
</div>
