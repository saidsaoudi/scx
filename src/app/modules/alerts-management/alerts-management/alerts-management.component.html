<div class="grid  ml-2 mr-2 mt-3">
    <div class="col-12 sm:col-12 md:col-12 lg:col-2 filter-list p-3">
        <div class="flex"><i class="pi pi-filter-fill"></i><h4 class="font-normal pl-2">Filtrer par :</h4></div>
        <div class="mt-3">
            <p-iconField iconPosition="right">
                <p-inputIcon styleClass="pi pi-search" />
                <input type="text" pInputText placeholder="ID, Produit, Classe, DCI..." />
            </p-iconField>
        </div>
        <div class="mt-3">
            <div class="card flex justify-content-center">
                <p-accordion class="w-full" expandIcon="pi pi-angle-left" collapseIcon="pi pi-angle-down">
                <p-accordionTab [selected]="true">
                    <ng-template pTemplate="header" >
                        <span class="flex align-items-center gap-2 w-full">
                            Criticité
                        </span>
                    </ng-template>
                    <div class="pl-0 mt-2">
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Trés éléve" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Toutes" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Moyenne" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Faible" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                    </div>
                </p-accordionTab>
                <p-accordionTab>
                    <ng-template pTemplate="header">
                        <span class="flex align-items-center gap-2 w-full">
                            Type d'alerte
                        </span>
                    </ng-template>
                    <div class="pl-0 mt-2">
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Trés éléve" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Toutes" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Moyenne" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Faible" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                    </div>
                </p-accordionTab>
                <p-accordionTab>
                    <ng-template pTemplate="header">
                        <span class="flex align-items-center gap-2 w-full">
                            Classe
                        </span>
                    </ng-template>
                    <div class="pl-0 mt-2">
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Trés éléve" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Toutes" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Moyenne" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Faible" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                    </div>
                </p-accordionTab>
                <p-accordionTab>
                    <ng-template pTemplate="header">
                        <span class="flex align-items-center gap-2 w-full">
                            Anomalie
                        </span>
                    </ng-template>
                    <div class="pl-0 mt-2">
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Trés éléve" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Toutes" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Moyenne" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Faible" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                    </div>
                </p-accordionTab>
                <p-accordionTab  [selected]="true">
                    <ng-template pTemplate="header">
                        <span class="flex align-items-center gap-2 w-full">
                            Status
                        </span>
                    </ng-template>
                    <div class="pl-0 mt-2">
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Trés éléve" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Ouvert" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="En cours de traitement" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                        <div class="mb-2">
                            <p-checkbox 
                            [(ngModel)]="toutes"
                            label="Cloturé" 
                            name="toutes" 
                            value="Toutes" />
                        </div>
                        <div class="mb-3">
                            <label>Date et heure</label>
                            <div class="mt-2">
                                <p-calendar 
                                    [(ngModel)]="date1" 
                                    [iconDisplay]="'input'" 
                                    [showIcon]="true" 
                                    placeholder="De"
                                    inputId="icondisplay" />
                            </div>
                            <div class="mt-2">
                                <p-calendar 
                                    [(ngModel)]="date2" 
                                    [iconDisplay]="'input'" 
                                    [showIcon]="true" 
                                    placeholder="A"
                                    inputId="icondisplay" />
                            </div>
                        </div>
                    </div>
                </p-accordionTab>
            </p-accordion>
            
            </div>
            <div class="btn-filter flex">
                <p-button label="Réinitialiser" [text]="true" class="btn-reinitialiser"/>
                <p-button label="Valider" class="btn-valider"/>
            </div>
        </div>
    </div>
    <div class="col-12 sm:col-12 md:col-12 lg:col-10 pt-0">
        <div class="filter mb-3 lg:flex justify-content-between">
            <div class="mb-3">
                <p-dropdown 
                    [options]="regions" 
                    [(ngModel)]="selectedRegion" 
                    optionLabel="name" 
                    placeholder="Région : Tous" />
            </div>
            <div class="mb-3">
                <p-dropdown 
                    [options]="province" 
                    [(ngModel)]="selectedProvince" 
                    optionLabel="name" 
                    placeholder="Province : Tous" />
            </div>
            <div class="mb-3">
                <p-dropdown 
                    [options]="hopital"
                    class="w-hopital"
                    [(ngModel)]="selectedHopital" 
                    optionLabel="name" 
                    placeholder="Centre de santé + Hopital : Tous" />
            </div>
            <div class="mb-3">
                <p-calendar 
                    [(ngModel)]="rangeDates" 
                    selectionMode="range" 
                    [readonlyInput]="true"
                    [showIcon]="true"  
                    placeholder="Du 20/09/25 au 27/09/25" />
            </div>
            <div>
                <p-button icon="pi pi-search"  class="search-filter"/>
                <p-button icon="pi pi-download" class="download-filter ml-2"/>
                <p-button label="Reporting" icon="pi pi-list" class="btn-reporting ml-2"/>
                <p-button label="Alerts Settings" icon="pi pi-bell" class="btn-alert ml-2"/>
            </div>
        </div>
        <div class="overflow-auto">
            <table class="w-full text-left text-gray-500 mt-3 table-alert">
              <thead>
                <tr>
                  <th *ngFor="let header of headerColumuns" scope="col"
                    class="font-bold whitespace-nowrap text-black pl-3">
                    {{ header }}
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr class="table-row  whitespace-nowrap table-list"
                  *ngFor="let produit of [0,1,2,3,4,5]">
                  <td class="p-3 font-medium"><span class="text-red-500">Très élevé</span><p class="text-black-500 text-xs">ID : 65642</p></td>
                  <td class="p-3 font-medium items">Point de commande</td>
                  <td class="p-3 font-medium items">D-cure</td>
                  <td class="p-3 font-medium items">Vitamine</td>
                  <td class="p-3 font-medium items">Vitamine D3</td>
                  <td class="p-3 font-medium items">Casablanca</td>
                  <td class="p-3 font-medium items">27/09/2024<span class="ml-2">10:23</span></td>
                  <td class="p-3 font-medium items">En cours de traitement</td>
                </tr>
              </tbody>
            </table>
        </div>
    </div>
</div>
