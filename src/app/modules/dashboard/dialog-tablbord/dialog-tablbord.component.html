<div class="col-12 sm:col-12 md:col-12 lg:col-12 p-2">
    <div class="dialog-chart">
        <h3 class="pb-2">Taux de péremption</h3>
        <p-chart type="line" [data]="data" [options]="options" class="dialogchartline"/>
        <div class="grid btm-chart">
            <div class="col-12 sm:col-12 md:col-12 lg:col-6">
                <h2>0.7%</h2>
            </div> 
        </div>
    </div>
</div>
<div class="col-12 sm:col-12 md:col-12 lg:col-12 p-2">
    <div class="chartbartabl">
        <p-chart type="bar" [data]="databar" [options]="optionsbar" />
    </div>
    <div class="overflow-auto">
        <table class="w-full text-left text-gray-500 mt-4">
          <thead>
            <tr>
              <th *ngFor="let header of headerColumuns" scope="col"
                class="p-3 font-bold whitespace-nowrap text-black">
                {{ header }}
              </th>
            </tr>
          </thead>
          <tbody>
            <tr class="table-row  whitespace-nowrap border-b border-gray-800"
              *ngFor="let produit of [0,1,2,3]">
              <td class="p-3 font-medium">ELOXATINE</td>
              <td class="p-3 font-medium">110</td>
              <td class="p-3 font-medium">L2552</td>
              <td class="p-3 font-medium">12/09/2024</td>
              <td class="p-3 font-medium">Hay Hassani</td>
            </tr>
          </tbody>
        </table>
      </div>
</div>
<div class="grid btndialog w-full mt-3 mb-3">
    <div class="col-12 sm:col-12 md:col-12 lg:col-6">
        <p-button label="Fermer" severity="secondary" class="pl-2 btn-fermer" />
    </div>
    <div class="col-12 sm:col-12 md:col-12 lg:col-6 text-right">
        <p-button label="Voir Détails" icon="pi pi-list" class="btn-detail"/>
    </div>
</div>
