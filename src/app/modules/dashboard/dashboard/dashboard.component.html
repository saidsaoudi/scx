<div class="grid mb-6">
    <div class="col-12 sm:col-12 md:col-12 lg:col-3 cursor-pointer card-body">
        <div class="card bg-white p-5">
            <div class="grid">
                <div class="col-12 sm:col-12 md:col-12 lg:col-10">
                    <span class="align-slef-center">
                        <h5 class="mb-2">Image de stock</h5>
                        <h2 class="m-b-0">671.44</h2>
                    </span>
                </div>
                <div class="col-12 sm:col-12 md:col-12 lg:col-2 flex align-items-center">
                    <i class="pi pi-chart-line text-3xl"></i>
                </div>
            </div>
        </div> 
        <div class="spearator0"></div>
    </div>
    <div class="col-12 sm:col-12 md:col-12 lg:col-3 cursor-pointer card-body">
        <div class="card bg-white p-5">
            <div class="grid">
                <div class="col-12 sm:col-12 md:col-12 lg:col-10">
                    <span class="align-slef-center">
                        <h5 class="mb-2">Produits en rupture</h5>
                        <h2 class="m-b-0">196</h2>
                    </span>
                </div>
                <div class="col-12 sm:col-12 md:col-12 lg:col-2 flex align-items-center">
                    <i class="pi pi-ban text-3xl"></i>
                </div>
            </div>
        </div> 
        <div class="spearator1"></div>
    </div>
    <div class="col-12 sm:col-12 md:col-12 lg:col-3 cursor-pointer card-body">
        <div class="card bg-white p-5">
            <div class="grid">
                <div class="col-12 sm:col-12 md:col-12 lg:col-10">
                    <span class="align-slef-center">
                        <h5 class="mb-2">Produits périmés</h5>
                        <h2 class="m-b-0">0</h2>
                    </span>
                </div>
                <div class="col-12 sm:col-12 md:col-12 lg:col-2 flex align-items-center">
                    <i class="pi pi-hourglass text-3xl"></i>
                </div>
            </div>
        </div> 
        <div class="spearator2"></div>
    </div>
    <div class="col-12 sm:col-12 md:col-12 lg:col-3 cursor-pointer card-body">
        <div class="card bg-white p-5">
            <div class="grid">
                <div class="col-12 sm:col-12 md:col-12 lg:col-10">
                    <span class="align-slef-center">
                        <h5 class="mb-2">Alerts des stocks</h5>
                        <h2 class="m-b-0">0</h2>
                    </span>
                </div>
                <div class="col-12 sm:col-12 md:col-12 lg:col-2 flex align-items-center">
                    <i class="pi pi-exclamation-triangle text-3xl"></i>
                </div>
            </div>
        </div> 
        <div class="spearator3"></div>
    </div>
</div>
<div class="grid">
    <div class="col-12 sm:col-12 md:col-12 lg:col-4">
        <div class="card-body-btm">
            <div class="text-right pt-3 pb-5 mr-2">
                <span class="badge-span">Approvisionnement</span>
            </div>
            <div class="mt-4 pb-5 pl-3 mr-2">
                <h3 class="heading">Progression des commandes</h3>
                <div class="card mt-4">
                    <p-progressBar [value]="55" />
                </div>
                <div class="mt-3">
                    <p><span>55 traitées</span> sur 32 commandes</p>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12 sm:col-12 md:col-12 lg:col-4">
        <div class="card-body-btm">
            <div class="text-right pt-3 pb-5 mr-2">
                <span class="badge-span">Réceptions</span>
            </div>
            <div class="mt-4 pb-5 pl-3 mr-2">
                <h3 class="heading">Attendus de réception</h3>
                <div class="card mt-4">
                    <p-progressBar [value]="75" />
                </div>
                <div class="mt-3">
                    <p><span>75 traitées</span> sur 31 transferts</p>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12 sm:col-12 md:col-12 lg:col-4">
        <div class="card-body-btm">
            <div class="text-right pt-3 pb-5 mr-2">
                <span class="badge-span">Démarques et avaries</span>
            </div>
            <div class="mt-4 pb-5 pl-3 mr-2">
                <h3 class="heading">Gestion des anomalies </h3>
                <div class="card mt-4">
                    <p-progressBar [value]="28" />
                </div>
                <div class="mt-3">
                    <p><span>28 traitées</span> sur 2 cas</p>
                </div>
            </div>
        </div>
    </div>
</div>
