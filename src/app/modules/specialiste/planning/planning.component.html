<ejs-schedule width='100%' height='550px' [selectedDate]="selectedDate" [eventSettings]="eventSettings" [timeScale]="timeScale">
    <ng-template #timeScaleMajorSlotTemplate let-data>
        <div class="majorTime">{{getMajorTime(data.date)}}</div>
    </ng-template>
    <ng-template #timeScaleMinorSlotTemplate let-data>
        <div class="minorTime">{{getMinorTime(data.date)}}</div>
    </ng-template>
    <e-views>
        <e-view option="Week">
            <ng-template #eventTemplate let-data>
                <div class='app-template-wrap' [style.background]="data.SecondaryColor">
                    <div class="time" [style.background]="data.PrimaryColor">
                       9:50 - 10.00
                    </div>
                    <div class="doctor">
                        Said Essaoudi
                    </div>
                    <div class="description">
                        Dermatologue
                    </div>
                </div>
            </ng-template>
        </e-view>
        <e-view option="Month"></e-view>
        <e-view option="TimelineMonth"></e-view>
    </e-views>
</ejs-schedule>
