<div class="fixed w-full">
  <div class="grid tolbar bg-white"  #toolbar>
    <div class="col-12 sm:col-12 md:col-12 lg:col-6 flex align-items-center">
      <ul class="list-none flex  align-items-center pl-5 pt-3">
        <li class="pr-4 cursor-pointer" (click)="goToHome()">
          <i class="pi pi-home text-xl "></i>
        </li>
        <li class="search-autocmpt">
          <p-floatLabel>
            <p-autoComplete 
                [(ngModel)]="selectedItem" 
                [suggestions]="suggestions" 
                (completeMethod)="search($event)" 
                inputId="float-label"/>
            <label for="float-label" class="label-autto">Changer de dépôt</label>
        </p-floatLabel>
        </li>
      </ul>
    </div>
    <div class="col-12 sm:col-12 md:col-12 lg:col-6 flex align-items-center justify-content-end pr-4">
      <ul class="list-none flex  align-items-center pt-3">
        <li class="pr-4 cursor-pointer"><i class="pi pi-comments text-xl "></i></li>
        <li class="pr-4 cursor-pointer"><i class="pi pi-microsoft text-xl "></i></li>
        <li class="pr-5">
          <i class="pi pi-bell text-xl cursor-pointer" pBadge value="1" (click)="ntf.toggle($event)"></i>
          <p-overlayPanel #ntf>
            <ng-template pTemplate>
              <div class="pt-3 pb-3 text-center">
                <div class="text-center open-notif"><i class="pi pi-folder-open text-4xl"></i></div>
                <p class="text-center p-3">Vous n'avez aucune notification récente</p>
            </div>
            </ng-template>
        </p-overlayPanel>
        </li>
        <li>
          <div class="separate">
            <div class="flex align-items-center gap-2 cursor-pointer"  pRipple (click)="op.toggle($event)">
              <p-avatar 
                  image="https://primefaces.org/cdn/primeng/images/demo/avatar/walter.jpg" 
                  size="large" 
                  shape="circle"/>
              <span class="font-bold">
                  Said Essaoudi
              </span>
            </div>
          </div>
            <p-overlayPanel #op>
                <ng-template pTemplate>
                  <ul class="menu-details">
                    <li pRipple class="p-2 cursor-pointer pl-3 pr-3 pb-3" (click)="goTouser()">
                      <a class="flex align-items-center no-underline text-color">
                          <i class="pi pi-user text-primary"></i>
                          <span class="pl-3">Mon compte</span>
                      </a>
                  </li>
                    <li pRipple class="p-2 cursor-pointer pl-3 pr-3 pb-3" (click)="logout()">
                        <a class="flex align-items-center no-underline text-color">
                            <i class="pi pi-power-off text-primary"></i>
                            <span class="pl-3">Déconnexion</span>
                        </a>
                    </li>
                  </ul>
                </ng-template>
            </p-overlayPanel>
        </li>
      </ul>
    </div>
  </div>
</div>
<app-sidebar (changeStyle)="updateStyle($event)"></app-sidebar>
