<div>
  <div class="top grid  w-auto mb-3  mx-0 p-0">
    <div class="col-12 sm:col-4 md:col-2 lg:col-1 pr-0">
      <img src="../../../../assets/img/icon-menu.png" class="menu cursor-pointer lg:w-4 pt-3  ml-3" pRipple (click)="op.toggle($event)">
    </div>
      <p-overlayPanel #op>
          <ng-template pTemplate>
              <ul class="menu-details">
                  <li pRipple class="cursor-pointer">
                    <div class="grid mt-1">
                      <div class="col-2 text-center">
                        <img src="../../../../assets/img/icons/icon1.svg" alt="" class="w-7">
                      </div>
                      <div class="col-6 p-0">
                        <p class="name mt-2">Tour de control</p>
                      </div>
                    </div>
                  </li>
                  <li pRipple class="cursor-pointer">
                    <div class="grid mt-1">
                      <div class="col-2 text-center">
                        <img src="../../../../assets/img/icons/icon1.svg" alt="" class="w-7">
                      </div>
                      <div class="col-6 p-0">
                        <p class="name mt-2">Alerts Management</p>
                      </div>
                    </div>
                  </li>
                  <li pRipple class="cursor-pointer">
                    <div class="grid mt-1">
                      <div class="col-2 text-center">
                        <img src="../../../../assets/img/icons/icon2.svg" alt="" class="w-7">
                      </div>
                      <div class="col-6 p-0">
                        <p class="name mt-2">TMS</p>
                      </div>
                    </div>
                  </li>
                  <li pRipple class="cursor-pointer">
                    <div class="grid mt-1">
                      <div class="col-2 text-center">
                        <img src="../../../../assets/img/icons/icon3.svg" alt="" class="w-7">
                      </div>
                      <div class="col-6 p-0">
                        <p class="name mt-2">Approvisionnement</p>
                      </div>
                    </div>
                  </li>
                  <li pRipple class="cursor-pointer">
                    <div class="grid mt-1">
                      <div class="col-2 text-center">
                        <img src="../../../../assets/img/icons/icon3.svg" alt="" class="w-7">
                      </div>
                      <div class="col-6 p-0">
                        <p class="name mt-2">Planification (APS)</p>
                      </div>
                    </div>
                  </li>
                  <li pRipple class="cursor-pointer">
                    <div class="grid mt-1">
                      <div class="col-2 text-center">
                        <img src="../../../../assets/img/icons/icon1.svg" alt="" class="w-7">
                      </div>
                      <div class="col-6 p-0">
                        <p class="name mt-2">Inventaire</p>
                      </div>
                    </div>
                  </li>
                  <li pRipple class="cursor-pointer" (click)="logout()">
                    <div class="grid mt-1">
                      <div class="col-2 text-center">
                        <img src="../../../../assets/img/icons/icon1.svg" alt="" class="w-7">
                      </div>
                      <div class="col-6 p-0">
                        <p class="name mt-2">Déconnexion</p>
                      </div>
                    </div>
                  </li>
              </ul>
          </ng-template>
      </p-overlayPanel>
      <div class="col-12 sm:col-4 md:col-5 lg:col-7 pl-0 mt-1">
        <img src="../../../../assets/img/logo.png" alt="" class="w-3 pt-3">
      </div>
      <div class="col-12 sm:col-12 md:col-3 lg:col-4 lg:text-right">
        <img src="../../../../assets/img/dawla.png" alt="" class="cursor-pointer w-5 pt-3">
      </div>
    </div>
</div>
